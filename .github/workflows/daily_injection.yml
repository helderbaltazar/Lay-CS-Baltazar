name: Daily Layback Injection

on:
  schedule:
    # Rodar todos os dias às 11:00 UTC (08:00 BRT)
    - cron: '0 11 * * *'
  workflow_dispatch:
    # Permite disparar o workflow manualmente pelo painel do GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Restore API-Football Cache
        uses: actions/cache@v3
        with:
          path: cache/
          key: api-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            api-cache-${{ runner.os }}-

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: |
          playwright install chromium

      - name: Run Injection Script
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          LAYBACK_EMAIL: ${{ secrets.LAYBACK_EMAIL }}
          LAYBACK_PASSWORD: ${{ secrets.LAYBACK_PASSWORD }}
          # Supondo que você precisa passar pro config.py:
          # O script lerá do environment (os.getenv) se estiver configurado
        run: |
          python run_real_injection.py
