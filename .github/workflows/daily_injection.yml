name: Daily Layback Injection

on:
  schedule:
    # Rodar todos os dias às 03:01, 08:01 e 12:01 UTC (Cascata de Retry para Resiliência da API)
    - cron: '10 3 * * *'
    - cron: '10 4 * * *'
    - cron: '10 5 * * *'
  workflow_dispatch:
    # Permite disparar o workflow manualmente pelo painel do GitHub
  push:
    branches: [main]
    paths:
      - 'analysis/**'
      - 'data/**'
      - 'database/**'
      - 'models/**'
      - 'web/**'
      - 'scripts/**'
      - 'run_real_injection.py'
      - 'update_results.py'
      - 'config.py'
      - 'requirements.txt'
      - '.github/workflows/daily_injection.yml'

concurrency:
  group: daily-injection
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore Orchestrator Cache (API + Dados Pendentes)
        uses: actions/cache@v4
        with:
          path: cache/
          key: orchestrator-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            orchestrator-cache-${{ runner.os }}-

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: |
          playwright install chromium
          playwright install-deps

      - name: Smoke Test (Fase 0) — Bloqueia se falhar
        run: pytest tests/unit/ -v --tb=short -x

      - name: Diagnóstico — Verificar Cookies Layback no Banco
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/verify_cookies.py

      - name: Atualizar Power Rankings (Opta)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python scripts/update_opta_rankings.py || echo "⚠️ Falha ao buscar Opta. Continuando sem atualização."

      - name: 🤖 Executar Agente Orquestrador (Auto-Healing)
        timeout-minutes: 35
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LAYBACK_EMAIL: ${{ secrets.LAYBACK_EMAIL }}
          LAYBACK_PASSWORD: ${{ secrets.LAYBACK_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
          PYTHONPATH: ${{ github.workspace }}
        run: python -m agents.orchestrator

      - name: Upload Logs de Incidentes e Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orchestrator-logs-${{ github.run_id }}
          path: |
            logs/
            cache/orchestrator_incidents.jsonl
          if-no-files-found: warn


