name: Daily Layback Injection

on:
  schedule:
    # Rodar todos os dias às 03:01 UTC (00:01 BRT)
    - cron: '1 3 * * *'
  workflow_dispatch:
    # Permite disparar o workflow manualmente pelo painel do GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore API-Football Cache
        uses: actions/cache@v4
        with:
          path: cache/
          key: api-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            api-cache-${{ runner.os }}-

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: |
          playwright install chromium
          playwright install-deps

      - name: Run Injection Script
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          LAYBACK_EMAIL: ${{ secrets.LAYBACK_EMAIL }}
          LAYBACK_PASSWORD: ${{ secrets.LAYBACK_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
          # Supondo que você precisa passar pro config.py:
          # O script lerá do environment (os.getenv) se estiver configurado
        run: |
          python run_real_injection.py

      - name: Upload Debug Screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: logs/login_error.png
