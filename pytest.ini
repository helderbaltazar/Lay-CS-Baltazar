[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = venv .venv .git .pytest_cache data logs cache gh_logs*
markers =
    unit: Testes unitarios
    integration: Testes de integracao
    web: Testes web
    regression: Testes de regressao
addopts = -v --tb=short

